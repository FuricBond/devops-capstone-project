apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: accounts-cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: alpine:3
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        echo "Cleaning shared workspace..."
        find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
        echo "Workspace cleanup completed."
