apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: accounts-build
spec:
  steps:
    - name: build-and-push
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      script: |
        #!/bin/sh
        set -eu
        echo "Starting OpenShift image build..."
        oc start-build accounts --follow
        echo "Image build and push completed."
        oc get imagestreamtag accounts:latest
