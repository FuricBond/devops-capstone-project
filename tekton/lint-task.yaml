apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: accounts-lint
spec:
  workspaces:
    - name: source
  steps:
    - name: lint
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m pip install --upgrade pip
        pip install flake8
        flake8 service tests
