apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: accounts-ci-cd
spec:
  workspaces:
    - name: shared-workspace
  tasks:
    - name: clone
      taskRef:
        name: accounts-clone
      workspaces:
        - name: output
          workspace: shared-workspace

    - name: lint
      runAfter:
        - clone
      taskRef:
        name: accounts-lint
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: test
      runAfter:
        - lint
      taskRef:
        name: accounts-test
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: build
      runAfter:
        - test
      taskRef:
        name: accounts-build

    - name: deploy
      runAfter:
        - build
      taskRef:
        name: accounts-deploy

    - name: cleanup
      runAfter:
        - deploy
      taskRef:
        name: accounts-cleanup
      workspaces:
        - name: source
          workspace: shared-workspace
